version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dream_sport_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-dream_sport_db}
      POSTGRES_USER: ${DB_USER:-dream_sport_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dream_sport_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dream_sport_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dream_sport_user} -d ${DB_NAME:-dream_sport_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (Optional - Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dream_sport_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dreamsport.tn
      PGADMIN_DEFAULT_PASSWORD: admin123456
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - dream_sport_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # Backend API (Node.js/Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dream_sport_backend
    restart: always
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      DATABASE_URL: postgresql://${DB_USER:-dream_sport_user}:${DB_PASSWORD:-dream_sport_password}@postgres:${DB_PORT:-5432}/${DB_NAME:-dream_sport_db}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-dream_sport_db}
      DB_USER: ${DB_USER:-dream_sport_user}
      DB_PASSWORD: ${DB_PASSWORD:-dream_sport_password}
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-default_refresh_secret_change_in_production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dream_sport_network
    command: npm run dev

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dream_sport_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - dream_sport_network
    command: npm run dev

volumes:
  postgres_data:
  pgadmin_data:
  backend_uploads:

networks:
  dream_sport_network:
    driver: bridge
